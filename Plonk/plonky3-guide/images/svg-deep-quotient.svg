<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif">
  <rect width="900" height="380" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">DEEP-FRI：在“域外”点 ζ 打开，可靠性大幅提升</text>

  <!-- domain band H -->
  <rect x="120" y="250" width="430" height="34" rx="6" fill="#e6f7f3" stroke="#10a37f" stroke-width="1.5"/>
  <text x="335" y="272" text-anchor="middle" font-size="13" fill="#0f172a">求值域 H（码字所在）</text>

  <!-- x-axis -->
  <line x1="70" y1="267" x2="830" y2="267" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- curve f through H points, extending to ζ -->
  <path d="M 130 230 Q 250 110 340 230 T 540 230 Q 640 150 700 120" fill="none" stroke="#0f172a" stroke-width="2.5"/>
  <text x="300" y="120" font-size="15" fill="#0f172a" font-style="italic">f(x)</text>

  <!-- H evaluation dots on curve -->
  <g fill="#10a37f">
    <circle cx="150" cy="218" r="5"/><circle cx="210" cy="168" r="5"/><circle cx="270" cy="150" r="5"/>
    <circle cx="330" cy="172" r="5"/><circle cx="390" cy="206" r="5"/><circle cx="450" cy="232" r="5"/>
    <circle cx="510" cy="226" r="5"/>
  </g>

  <!-- zeta outside H -->
  <line x1="700" y1="267" x2="700" y2="120" stroke="#2563eb" stroke-width="1.6" stroke-dasharray="6 5"/>
  <circle cx="700" cy="120" r="7" fill="#2563eb"/>
  <text x="700" y="108" text-anchor="middle" font-size="14" fill="#2563eb" font-weight="700">f(ζ)</text>
  <text x="700" y="294" text-anchor="middle" font-size="15" fill="#2563eb" font-weight="700">ζ</text>
  <text x="765" y="267" font-size="13" fill="#2563eb">← 域外（不在 H）</text>

  <!-- quotient note -->
  <rect x="120" y="312" width="660" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="140" y="336" font-size="14" fill="#0f172a">不在 f 上直接跑 FRI，而是对它的“DEEP 商”跑 FRI：</text>
  <text x="140" y="356" font-size="14" fill="#0f172a" font-family="'Segoe UI',monospace">g(x) = ( f(ζ) − f(x) ) / ( ζ − x )  　← ζ 在承诺之后采样，且在 H 之外</text>
</svg>
