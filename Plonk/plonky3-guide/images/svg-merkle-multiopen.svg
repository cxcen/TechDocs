<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif">
  <rect width="920" height="470" fill="#ffffff"/>
  <text x="460" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">Merkle 承诺 + 多重打开：查询路径去重，只发一次</text>

  <!-- tree edges (light) -->
  <g stroke="#cbd5e1" stroke-width="1.6" fill="none">
    <line x1="455" y1="90" x2="235" y2="170"/><line x1="455" y1="90" x2="675" y2="170"/>
    <line x1="235" y1="170" x2="125" y2="250"/><line x1="235" y1="170" x2="345" y2="250"/>
    <line x1="675" y1="170" x2="565" y2="250"/><line x1="675" y1="170" x2="785" y2="250"/>
    <line x1="125" y1="250" x2="70" y2="345"/><line x1="125" y1="250" x2="180" y2="345"/>
    <line x1="345" y1="250" x2="290" y2="345"/><line x1="345" y1="250" x2="400" y2="345"/>
    <line x1="565" y1="250" x2="510" y2="345"/><line x1="565" y1="250" x2="620" y2="345"/>
    <line x1="785" y1="250" x2="730" y2="345"/><line x1="785" y1="250" x2="840" y2="345"/>
  </g>

  <!-- auth paths for queries 290 & 400 (teal) -->
  <g stroke="#10a37f" stroke-width="3" fill="none">
    <line x1="290" y1="345" x2="345" y2="250"/><line x1="400" y1="345" x2="345" y2="250"/>
    <line x1="345" y1="250" x2="235" y2="170"/><line x1="235" y1="170" x2="455" y2="90"/>
  </g>

  <!-- nodes -->
  <g>
    <!-- root -->
    <circle cx="455" cy="90" r="13" fill="#10a37f"/><text x="455" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">根</text>
    <!-- level1 -->
    <circle cx="235" cy="170" r="10" fill="#10a37f"/><circle cx="675" cy="170" r="9" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
    <!-- level2 -->
    <circle cx="125" cy="250" r="9" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
    <circle cx="345" cy="250" r="10" fill="#10a37f"/>
    <circle cx="565" cy="250" r="9" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
    <circle cx="785" cy="250" r="9" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  </g>

  <!-- leaves (squares) -->
  <g>
    <rect x="62" y="338" width="16" height="16" rx="2" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
    <rect x="180" y="338" width="16" height="16" rx="2" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
    <rect x="282" y="338" width="16" height="16" rx="2" fill="#2563eb"/>
    <rect x="392" y="338" width="16" height="16" rx="2" fill="#2563eb"/>
    <rect x="502" y="338" width="16" height="16" rx="2" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
    <rect x="612" y="338" width="16" height="16" rx="2" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
    <rect x="722" y="338" width="16" height="16" rx="2" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
    <rect x="832" y="338" width="16" height="16" rx="2" fill="#fff" stroke="#94a3b8" stroke-width="1.6"/>
  </g>
  <text x="290" y="378" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">查询 q₁</text>
  <text x="400" y="378" text-anchor="middle" font-size="12" fill="#2563eb" font-weight="700">查询 q₂</text>

  <!-- legend -->
  <g transform="translate(560,400)">
    <rect x="0" y="0" width="330" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <circle cx="22" cy="20" r="6" fill="#10a37f"/><text x="36" y="24" font-size="12" fill="#0f172a">共享祖先：整批查询只发一次（去重）</text>
    <rect x="16" y="36" width="12" height="12" rx="2" fill="#2563eb"/><text x="36" y="46" font-size="12" fill="#0f172a">被抽查的叶子（行）</text>
  </g>
  <text x="460" y="445" text-anchor="middle" font-size="13" fill="#64748b">每个 LDE 码字行作为叶子建 Merkle 树；根 = 承诺。FRI 每轮一棵树，多重证明（MultiProof）跨查询去重。</text>
</svg>
