<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif">
  <rect width="900" height="300" fill="#ffffff"/>
  <text x="450" y="36" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">SIMD 打包：一条 AVX2 指令并行处理 8 个域元素</text>

  <!-- incoming elements -->
  <g font-size="13" fill="#2563eb" text-anchor="middle">
    <text x="135" y="92">e₀</text><text x="225" y="92">e₁</text><text x="315" y="92">e₂</text><text x="405" y="92">e₃</text>
    <text x="495" y="92">e₄</text><text x="585" y="92">e₅</text><text x="675" y="92">e₆</text><text x="765" y="92">e₇</text>
  </g>
  <g stroke="#2563eb" stroke-width="1.5" fill="none" marker-end="url(#sarrow)">
    <line x1="135" y1="100" x2="135" y2="128"/><line x1="225" y1="100" x2="225" y2="128"/>
    <line x1="315" y1="100" x2="315" y2="128"/><line x1="405" y1="100" x2="405" y2="128"/>
    <line x1="495" y1="100" x2="495" y2="128"/><line x1="585" y1="100" x2="585" y2="128"/>
    <line x1="675" y1="100" x2="675" y2="128"/><line x1="765" y1="100" x2="765" y2="128"/>
  </g>
  <defs>
    <marker id="sarrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- register -->
  <g>
    <rect x="90" y="130" width="720" height="70" rx="8" fill="#0f172a"/>
    <text x="100" y="122" font-size="13" font-weight="700" fill="#0f172a">256-bit AVX2 寄存器（一条指令）</text>
    <!-- 8 cells -->
    <g font-size="15" fill="#ffffff" text-anchor="middle">
      <rect x="94" y="134" width="86" height="62" rx="4" fill="#10a37f"/><text x="137" y="170">e₀</text>
      <rect x="184" y="134" width="86" height="62" rx="4" fill="#10a37f"/><text x="227" y="170">e₁</text>
      <rect x="274" y="134" width="86" height="62" rx="4" fill="#10a37f"/><text x="317" y="170">e₂</text>
      <rect x="364" y="134" width="86" height="62" rx="4" fill="#10a37f"/><text x="407" y="170">e₃</text>
      <rect x="454" y="134" width="86" height="62" rx="4" fill="#10a37f"/><text x="497" y="170">e₄</text>
      <rect x="544" y="134" width="86" height="62" rx="4" fill="#10a37f"/><text x="587" y="170">e₅</text>
      <rect x="634" y="134" width="86" height="62" rx="4" fill="#10a37f"/><text x="677" y="170">e₆</text>
      <rect x="724" y="134" width="82" height="62" rx="4" fill="#10a37f"/><text x="763" y="170">e₇</text>
    </g>
    <text x="137" y="190" text-anchor="middle" font-size="11" fill="#0f172a">32-bit</text>
  </g>
  <text x="450" y="226" text-anchor="middle" font-size="14" fill="#0f172a">每个 32-bit 槽装一个 31-bit 域元素 → 一条指令做 8 路并行加减乘（AVX-512 可达 16 路）</text>
  <text x="450" y="250" text-anchor="middle" font-size="13" fill="#64748b">这就是为什么 prove 必须开 RUSTFLAGS="-Ctarget-cpu=native"：不开 SIMD，性能掉一个数量级。</text>
</svg>
