<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'PingFang SC','Microsoft YaHei','Segoe UI',system-ui,sans-serif">
  <rect width="820" height="520" fill="#ffffff"/>
  <text x="410" y="32" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">radix-2 FFT 蝶形（8 点）：O(n log n) 把求值 ↔ 系数互转</text>

  <!-- column headers -->
  <text x="80" y="62" text-anchor="middle" font-size="13" fill="#64748b">输入(位反转)</text>
  <text x="300" y="62" text-anchor="middle" font-size="13" fill="#64748b">级 1 · ω₂</text>
  <text x="520" y="62" text-anchor="middle" font-size="13" fill="#64748b">级 2 · ω₄</text>
  <text x="760" y="62" text-anchor="middle" font-size="13" fill="#64748b">输出</text>

  <!-- connections: straight (slate) + cross (teal) -->
  <g stroke-width="1.4" fill="none">
    <!-- stage 1 -->
    <g stroke="#cbd5e1">
      <line x1="80" y1="95" x2="300" y2="95"/><line x1="80" y1="140" x2="300" y2="140"/>
      <line x1="80" y1="185" x2="300" y2="185"/><line x1="80" y1="230" x2="300" y2="230"/>
      <line x1="80" y1="275" x2="300" y2="275"/><line x1="80" y1="320" x2="300" y2="320"/>
      <line x1="80" y1="365" x2="300" y2="365"/><line x1="80" y1="410" x2="300" y2="410"/>
    </g>
    <g stroke="#10a37f">
      <line x1="80" y1="95" x2="300" y2="140"/><line x1="80" y1="140" x2="300" y2="95"/>
      <line x1="80" y1="185" x2="300" y2="230"/><line x1="80" y1="230" x2="300" y2="185"/>
      <line x1="80" y1="275" x2="300" y2="320"/><line x1="80" y1="320" x2="300" y2="275"/>
      <line x1="80" y1="365" x2="300" y2="410"/><line x1="80" y1="410" x2="300" y2="365"/>
    </g>
    <!-- stage 2 -->
    <g stroke="#cbd5e1">
      <line x1="300" y1="95" x2="520" y2="95"/><line x1="300" y1="185" x2="520" y2="185"/>
      <line x1="300" y1="140" x2="520" y2="140"/><line x1="300" y1="230" x2="520" y2="230"/>
      <line x1="300" y1="275" x2="520" y2="275"/><line x1="300" y1="365" x2="520" y2="365"/>
      <line x1="300" y1="320" x2="520" y2="320"/><line x1="300" y1="410" x2="520" y2="410"/>
    </g>
    <g stroke="#10a37f">
      <line x1="300" y1="95" x2="520" y2="185"/><line x1="300" y1="185" x2="520" y2="95"/>
      <line x1="300" y1="140" x2="520" y2="230"/><line x1="300" y1="230" x2="520" y2="140"/>
      <line x1="300" y1="275" x2="520" y2="365"/><line x1="300" y1="365" x2="520" y2="275"/>
      <line x1="300" y1="320" x2="520" y2="410"/><line x1="300" y1="410" x2="520" y2="320"/>
    </g>
    <!-- stage 3 -->
    <g stroke="#cbd5e1">
      <line x1="520" y1="95" x2="760" y2="95"/><line x1="520" y1="275" x2="760" y2="275"/>
      <line x1="520" y1="140" x2="760" y2="140"/><line x1="520" y1="320" x2="760" y2="320"/>
      <line x1="520" y1="185" x2="760" y2="185"/><line x1="520" y1="365" x2="760" y2="365"/>
      <line x1="520" y1="230" x2="760" y2="230"/><line x1="520" y1="410" x2="760" y2="410"/>
    </g>
    <g stroke="#10a37f">
      <line x1="520" y1="95" x2="760" y2="275"/><line x1="520" y1="275" x2="760" y2="95"/>
      <line x1="520" y1="140" x2="760" y2="320"/><line x1="520" y1="320" x2="760" y2="140"/>
      <line x1="520" y1="185" x2="760" y2="365"/><line x1="520" y1="365" x2="760" y2="185"/>
      <line x1="520" y1="230" x2="760" y2="410"/><line x1="520" y1="410" x2="760" y2="230"/>
    </g>
  </g>

  <!-- nodes -->
  <g fill="#0f172a">
    <!-- input column x=80 -->
    <circle cx="80" cy="95" r="4"/><circle cx="80" cy="140" r="4"/><circle cx="80" cy="185" r="4"/><circle cx="80" cy="230" r="4"/>
    <circle cx="80" cy="275" r="4"/><circle cx="80" cy="320" r="4"/><circle cx="80" cy="365" r="4"/><circle cx="80" cy="410" r="4"/>
    <!-- s1 -->
    <circle cx="300" cy="95" r="4"/><circle cx="300" cy="140" r="4"/><circle cx="300" cy="185" r="4"/><circle cx="300" cy="230" r="4"/>
    <circle cx="300" cy="275" r="4"/><circle cx="300" cy="320" r="4"/><circle cx="300" cy="365" r="4"/><circle cx="300" cy="410" r="4"/>
    <!-- s2 -->
    <circle cx="520" cy="95" r="4"/><circle cx="520" cy="140" r="4"/><circle cx="520" cy="185" r="4"/><circle cx="520" cy="230" r="4"/>
    <circle cx="520" cy="275" r="4"/><circle cx="520" cy="320" r="4"/><circle cx="520" cy="365" r="4"/><circle cx="520" cy="410" r="4"/>
    <!-- out -->
    <circle cx="760" cy="95" r="4"/><circle cx="760" cy="140" r="4"/><circle cx="760" cy="185" r="4"/><circle cx="760" cy="230" r="4"/>
    <circle cx="760" cy="275" r="4"/><circle cx="760" cy="320" r="4"/><circle cx="760" cy="365" r="4"/><circle cx="760" cy="410" r="4"/>
  </g>

  <!-- input/output labels -->
  <g font-size="12" fill="#0f172a" text-anchor="end">
    <text x="70" y="99">x[0]</text><text x="70" y="144">x[4]</text><text x="70" y="189">x[2]</text><text x="70" y="234">x[6]</text>
    <text x="70" y="279">x[1]</text><text x="70" y="324">x[5]</text><text x="70" y="369">x[3]</text><text x="70" y="414">x[7]</text>
  </g>
  <g font-size="12" fill="#0f172a">
    <text x="770" y="99">X[0]</text><text x="770" y="144">X[1]</text><text x="770" y="189">X[2]</text><text x="770" y="234">X[3]</text>
    <text x="770" y="279">X[4]</text><text x="770" y="324">X[5]</text><text x="770" y="369">X[6]</text><text x="770" y="414">X[7]</text>
  </g>

  <!-- 2-point butterfly inset -->
  <g transform="translate(150,448)">
    <rect x="0" y="0" width="250" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="10" y="20" font-size="13" fill="#0f172a" font-weight="600">2 点蝶形基本运算：</text>
    <text x="10" y="42" font-size="13" fill="#0f172a" font-family="'Segoe UI',monospace">(a, b) → (a + ω·b,  a − ω·b)</text>
    <text x="160" y="20" font-size="12" fill="#10a37f">绿线 = 乘 ω 的交叉支</text>
  </g>
  <g transform="translate(430,448)">
    <rect x="0" y="0" width="330" height="58" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="12" y="22" font-size="13" fill="#0f172a">共 log₂n 级，每级 n/2 个蝶形 → 总复杂度 O(n log n)。</text>
    <text x="12" y="44" font-size="13" fill="#0f172a">twiddle 因子 ωᵏ 可缓存，多次同长变换复用。</text>
  </g>
</svg>
